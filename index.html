<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shivam Bhatoolaul</title>
  <meta name="description" content="Shivam Bhatoolaul's Personal Website">
  <meta name="keywords" content="Shivam Bhatoolaul, Software Developer, Data Engineer, Royal Bank of Canada, RBC, Portfolio, Minimalist, Resume, Email, GitHub, LinkedIn">

  <link rel="icon" href="assets/icons/logo.ico">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Main Section -->
  <section id="main">
    <div class="container">
      <!-- Text Content -->
      <div class="intro">
        <h1><b>Shivam</b> Bhatoolaul📱</h1>
        <p>&gt; <span id="typed"></span></p>

        <div class="social-links">
          <a href="mailto:shivambhatoolaul@icloud.com">
            <img src="assets/icons/mail.svg" alt="email"> Email
          </a>

          <a href="https://github.com/shivambhatoolaul" target="_blank">
            <img src="assets/icons/github.svg" alt="github"> GitHub
          </a>

          <a href="https://www.linkedin.com/in/shivambhatoolaul/" target="_blank">
            <img src="assets/icons/linkedin.svg" alt="linkedin"> LinkedIn
          </a>
        </div>

      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 Shivam Bhatoolaul 🦤 </p>
  </footer>

  <!-- Lightweight Typing Effect -->
  <script>
    const typedText = ['hi, my name\'s shivam!', 
                       'i\'m currently a data engineer at the royal bank of canada (rbc).', 
                       'you can find some of my professional stuff below...', 
                       'bye!'];
    let index = 0, charIndex = 0, deleting = false;
    const typedElement = document.getElementById("typed");

    function type() {
      const current = typedText[index];
      if (!deleting) {
        typedElement.textContent = current.slice(0, ++charIndex);
        if (charIndex === current.length) {
          deleting = true;
          setTimeout(type, 1200);
          return;
        }
      } else {
        typedElement.textContent = current.slice(0, --charIndex);
        if (charIndex === 0) {
          deleting = false;
          index = (index + 1) % typedText.length;
        }
      }
      setTimeout(type, deleting ? 60 : 120);
    }
    type();
  </script>
</body>
</html>
